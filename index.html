<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#fffaf1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="성경암송" />
    <meta name="application-name" content="성경암송" />
    <link rel="manifest" href="./manifest.webmanifest?v=22" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=22" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=22" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=22" />
    <title>성경암송</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --phone-max: 430px;
        --wine: #5c1a16;
        --wine-deep: #3d100e;
        --cream: #f7f0e4;
        --paper: #fffaf1;
        --ink: #2c1a14;
        --muted: #6b4a3a;
        --font-ui: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        --font-verse: "Noto Serif KR", "Batang", serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: #1a1a1a;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input,
      textarea {
        font-family: var(--font-ui);
      }

      .phone {
        width: 100%;
        max-width: var(--phone-max);
        height: 100%;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        background: var(--paper);
      }

      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }

      .screen[hidden] {
        display: none !important;
      }

      #screenVerse {
        z-index: 5;
        background: rgba(20, 8, 6, 0.75);
        -webkit-flex-direction: column;
        flex-direction: column;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        padding: 40px 24px;
        text-align: center;
      }

      #screenVerse:not([hidden]) {
        display: -webkit-flex !important;
        display: flex !important;
      }

      .verse-card {
        width: 100%;
        max-width: 340px;
        background: var(--paper);
        border-radius: 18px;
        padding: 36px 24px 28px;
      }

      .verse-text {
        font-family: var(--font-verse);
        font-size: 1.12rem;
        font-weight: 600;
        line-height: 1.9;
        color: var(--ink);
        word-break: keep-all;
        max-width: 34em;
      }

      .verse-ref {
        margin-top: 24px;
        font-family: var(--font-verse);
        font-size: 0.95rem;
        color: var(--muted);
      }

      .verse-actions {
        width: 100%;
        max-width: 320px;
        margin-top: 32px;
      }

      #screenHome,
      #screenLogin,
      #screenEdit {
        background: linear-gradient(180deg, #7a2a22 0%, var(--wine) 42%, var(--wine-deep) 100%);
        color: var(--cream);
        display: -webkit-flex;
        display: flex;
        -webkit-flex-direction: column;
        flex-direction: column;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        padding: 32px 24px;
        text-align: center;
      }

      #screenHome h1,
      .panel-title {
        font-family: var(--font-verse);
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .home-sub {
        margin-top: 12px;
        font-size: 0.95rem;
        opacity: 0.78;
      }

      .home-actions,
      .panel {
        margin-top: 36px;
        width: 100%;
        max-width: 320px;
      }

      .panel {
        background: var(--paper);
        color: var(--ink);
        border-radius: 18px;
        padding: 28px 22px;
        text-align: left;
      }

      .panel-title {
        display: block;
        margin-bottom: 8px;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        text-align: center;
        color: var(--ink);
      }

      .home-actions[hidden] {
        display: none !important;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 14px 16px;
        border: 0;
        border-radius: 999px;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        cursor: pointer;
      }

      .btn-primary {
        margin-top: 16px;
        background: #8e1b14;
        color: #fff;
      }

      .btn-secondary {
        margin-top: 10px;
        background: #efe4d4;
        color: var(--ink);
      }

      .btn-ghost {
        margin-top: 8px;
        background: transparent;
        color: var(--cream);
        border: 1px solid rgba(247, 240, 228, 0.35);
      }

      .field {
        margin-top: 14px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--muted);
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid #e4d5c3;
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font-size: 1rem;
        padding: 12px 14px;
        outline: none;
      }

      .field textarea {
        min-height: 140px;
        resize: none;
        font-family: var(--font-verse);
        line-height: 1.7;
      }

      .form-msg {
        min-height: 1.2em;
        margin-top: 10px;
        font-size: 0.85rem;
        color: #b42318;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <section class="screen" id="screenHome">
        <h1>성경암송</h1>
        <p class="home-sub">말씀을 마음에 새기는 시간</p>
        <div class="home-actions" id="guestActions">
          <button type="button" class="btn btn-ghost" id="openLoginBtn">관리자 로그인</button>
        </div>
        <div class="home-actions" id="masterActions" hidden>
          <button type="button" class="btn btn-ghost" id="openEditBtn">팝업 말씀 수정</button>
          <button type="button" class="btn btn-ghost" id="logoutBtn">로그아웃</button>
        </div>
      </section>

      <section class="screen" id="screenVerse" hidden>
        <div class="verse-card">
          <p class="verse-text" id="verseText">
            내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라
          </p>
          <p class="verse-ref" id="verseRef">- 누가복음 15장 7절 말씀 -</p>
          <div class="verse-actions">
            <button type="button" class="btn btn-primary" id="amenBtn">아멘</button>
            <button type="button" class="btn btn-secondary" id="popupEditBtn">수정</button>
          </div>
        </div>
      </section>

      <section class="screen" id="screenLogin" hidden>
        <form class="panel" id="loginForm" autocomplete="off">
          <strong class="panel-title">마스터 로그인</strong>
          <div class="field">
            <label for="loginId">아이디</label>
            <input
              id="loginId"
              name="verse-master-id"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              readonly
            />
          </div>
          <div class="field">
            <label for="loginPw">비밀번호</label>
            <input id="loginPw" name="verse-master-pw" type="password" autocomplete="new-password" readonly />
          </div>
          <p class="form-msg" id="loginMsg"></p>
          <button type="submit" class="btn btn-primary">로그인</button>
          <button type="button" class="btn btn-secondary" id="loginCancelBtn">취소</button>
        </form>
      </section>

      <section class="screen" id="screenEdit" hidden>
        <form class="panel" id="editForm" autocomplete="off">
          <strong class="panel-title">팝업 말씀 수정</strong>
          <div class="field">
            <label for="editVerse">말씀</label>
            <textarea id="editVerse" required></textarea>
          </div>
          <div class="field">
            <label for="editRef">출처</label>
            <input id="editRef" type="text" required />
          </div>
          <p class="form-msg" id="editMsg"></p>
          <button type="submit" class="btn btn-primary">저장</button>
          <button type="button" class="btn btn-secondary" id="editCancelBtn">닫기</button>
        </form>
      </section>
    </div>

    <script>
      const MASTER_ACCOUNT = { id: "redwaterdeer", password: "10qp29wo!Q" };
      const VERSE_KEY = "biblePopupVerse";
      const VERSE_META_KEY = "biblePopupVerseMeta";
      const SESSION_KEY = "bibleMasterLoggedIn";
      const LOCAL_SAVE_GUARD_KEY = "biblePopupLocalSaveAt";
      const APP_ROOT = "bible-amsong-redwaterdeer-popup-v1";
      const GUN_PEERS = [
        "https://gun-manhattan.herokuapp.com/gun",
        "https://peer.wallie.io/gun",
      ];
      const DEFAULT_VERSE = {
        text: "내가 너희에게 이르노니 이와 같이 죄인 하나가 회개하면 하늘에서는 회개할 것 없는 의인 아흔 아홉을 인하여 기뻐하는 것보다 더하리라",
        ref: "- 누가복음 15장 7절 말씀 -",
      };

      const screenVerse = document.getElementById("screenVerse");
      const screenHome = document.getElementById("screenHome");
      const screenLogin = document.getElementById("screenLogin");
      const screenEdit = document.getElementById("screenEdit");
      const verseTextEl = document.getElementById("verseText");
      const verseRefEl = document.getElementById("verseRef");
      const amenBtn = document.getElementById("amenBtn");
      const popupEditBtn = document.getElementById("popupEditBtn");
      const guestActions = document.getElementById("guestActions");
      const masterActions = document.getElementById("masterActions");
      const openLoginBtn = document.getElementById("openLoginBtn");
      const openEditBtn = document.getElementById("openEditBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const loginForm = document.getElementById("loginForm");
      const loginId = document.getElementById("loginId");
      const loginPw = document.getElementById("loginPw");
      const loginMsg = document.getElementById("loginMsg");
      const loginCancelBtn = document.getElementById("loginCancelBtn");
      const editForm = document.getElementById("editForm");
      const editVerse = document.getElementById("editVerse");
      const editRef = document.getElementById("editRef");
      const editMsg = document.getElementById("editMsg");
      const editCancelBtn = document.getElementById("editCancelBtn");

      let currentVerse = { ...DEFAULT_VERSE };
      let currentScreen = "home";
      let applyingRemote = false;
      let gunNode = null;
      let lastTick = Date.now();
      const startedAt = Date.now();
      let wasHidden = document.hidden === true || document.webkitHidden === true;

      function toTime(value) {
        const n = Number(value);
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      function readMeta() {
        try {
          return JSON.parse(localStorage.getItem(VERSE_META_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function loadCachedVerse() {
        try {
          const raw = localStorage.getItem(VERSE_KEY);
          if (!raw) return { ...DEFAULT_VERSE };
          const data = JSON.parse(raw);
          return {
            text: String(data.text || "").trim() || DEFAULT_VERSE.text,
            ref: String(data.ref || "").trim() || DEFAULT_VERSE.ref,
          };
        } catch {
          return { ...DEFAULT_VERSE };
        }
      }

      function writeLocal(verse, updatedAt) {
        currentVerse = {
          text: String(verse.text || "").trim() || DEFAULT_VERSE.text,
          ref: String(verse.ref || "").trim() || DEFAULT_VERSE.ref,
        };
        try {
          localStorage.setItem(VERSE_KEY, JSON.stringify(currentVerse));
          localStorage.setItem(VERSE_META_KEY, JSON.stringify({ updatedAt: toTime(updatedAt) || Date.now() }));
        } catch {
          /* ignore */
        }
        return currentVerse;
      }

      function markLocalSave(updatedAt) {
        try {
          sessionStorage.setItem(LOCAL_SAVE_GUARD_KEY, String(updatedAt || Date.now()));
        } catch {
          /* ignore */
        }
      }

      function isRecentLocalSave(ms) {
        try {
          const savedAt = toTime(sessionStorage.getItem(LOCAL_SAVE_GUARD_KEY));
          return !!(savedAt && Date.now() - savedAt < (ms || 8000));
        } catch {
          return false;
        }
      }

      function getGunNode() {
        if (gunNode) return gunNode;
        if (typeof Gun === "undefined") return null;
        try {
          const gun = Gun({ peers: GUN_PEERS, localStorage: false });
          gunNode = gun.get(APP_ROOT).get("popupVerse");
          return gunNode;
        } catch {
          return null;
        }
      }

      function publishVerse(verse, updatedAt) {
        const node = getGunNode();
        if (!node || applyingRemote) return Promise.resolve(false);
        return new Promise((resolve) => {
          let settled = false;
          const finish = (ok) => {
            if (settled) return;
            settled = true;
            resolve(ok);
          };
          try {
            node.put({ json: JSON.stringify(verse), updatedAt: updatedAt }, (ack) => finish(!ack || !ack.err));
          } catch {
            finish(false);
            return;
          }
          setTimeout(() => finish(true), 1800);
        });
      }

      function renderVerse() {
        verseTextEl.textContent = currentVerse.text;
        verseRefEl.textContent = currentVerse.ref;
      }

      function showScreen(name) {
        currentScreen = name;
        screenVerse.hidden = name !== "verse";
        screenLogin.hidden = name !== "login";
        screenEdit.hidden = name !== "edit";
        screenHome.hidden = false;
      }

      function showHome() {
        showScreen("home");
        screenVerse.hidden = true;
      }

      function showVerseScreen() {
        try {
          currentVerse = loadCachedVerse();
          renderVerse();
        } catch {
          currentVerse = { ...DEFAULT_VERSE };
          renderVerse();
        }
        showScreen("verse");
      }

      function isPageHidden() {
        return document.hidden === true || document.webkitHidden === true;
      }

      function onLockUnlock() {
        if (Date.now() - startedAt < 2500) return;
        if (currentScreen === "login" || currentScreen === "edit") return;
        if (currentScreen !== "home") return;
        showVerseScreen();
      }

      function subscribeSharedVerse() {
        const node = getGunNode();
        if (!node) return;
        node.on((data) => {
          try {
            if (isRecentLocalSave(8000)) return;
            if (!data || typeof data.json !== "string") return;
            const remoteAt = toTime(data.updatedAt);
            const localAt = toTime(readMeta().updatedAt);
            if (!remoteAt || remoteAt <= localAt) return;
            const remoteVerse = JSON.parse(data.json);
            if (!remoteVerse || typeof remoteVerse !== "object") return;
            applyingRemote = true;
            writeLocal(remoteVerse, remoteAt);
            renderVerse();
            if (currentScreen === "edit") {
              editVerse.value = currentVerse.text;
              editRef.value = currentVerse.ref;
            }
          } catch {
            /* ignore */
          } finally {
            applyingRemote = false;
          }
        });
      }

      async function saveVerse(verse) {
        const updatedAt = Date.now();
        writeLocal(verse, updatedAt);
        markLocalSave(updatedAt);
        renderVerse();
        return publishVerse(currentVerse, updatedAt);
      }

      function isLoggedIn() {
        try {
          return sessionStorage.getItem(SESSION_KEY) === "1";
        } catch {
          return false;
        }
      }

      function setLoggedIn(value) {
        try {
          if (value) sessionStorage.setItem(SESSION_KEY, "1");
          else sessionStorage.removeItem(SESSION_KEY);
        } catch {
          /* ignore */
        }
      }

      function renderAuth() {
        const loggedIn = isLoggedIn();
        guestActions.hidden = loggedIn;
        masterActions.hidden = !loggedIn;
      }

      function unlockField(event) {
        event.currentTarget.removeAttribute("readonly");
      }

      function openEdit() {
        editVerse.value = currentVerse.text;
        editRef.value = currentVerse.ref;
        editMsg.textContent = "";
        showScreen("edit");
        editVerse.focus();
      }

      function loadGunAndSync() {
        if (typeof Gun !== "undefined") {
          try {
            subscribeSharedVerse();
          } catch {
            /* ignore */
          }
          return;
        }
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/gun/gun.js";
        script.async = true;
        script.onload = function () {
          try {
            subscribeSharedVerse();
          } catch {
            /* ignore */
          }
        };
        document.head.appendChild(script);
      }

      currentVerse = loadCachedVerse();
      renderVerse();
      showHome();
      try {
        renderAuth();
      } catch {
        /* ignore */
      }

      document.addEventListener("visibilitychange", function () {
        const hidden = isPageHidden();
        if (hidden) {
          wasHidden = true;
          return;
        }
        if (wasHidden) {
          wasHidden = false;
          onLockUnlock();
        }
      });
      document.addEventListener("webkitvisibilitychange", function () {
        const hidden = isPageHidden();
        if (hidden) {
          wasHidden = true;
          return;
        }
        if (wasHidden) {
          wasHidden = false;
          onLockUnlock();
        }
      });

      function watchFreeze() {
        const now = Date.now();
        if (now - lastTick > 1500) onLockUnlock();
        lastTick = now;
        requestAnimationFrame(watchFreeze);
      }
      requestAnimationFrame(watchFreeze);
      setTimeout(loadGunAndSync, 0);

      amenBtn.addEventListener("click", function () {
        showHome();
      });
      popupEditBtn.addEventListener("click", function () {
        loginMsg.textContent = "";
        loginId.value = "";
        loginPw.value = "";
        showScreen("login");
        loginId.focus();
      });
      openLoginBtn.addEventListener("click", function () {
        loginMsg.textContent = "";
        loginId.value = "";
        loginPw.value = "";
        showScreen("login");
        loginId.focus();
      });
      openEditBtn.addEventListener("click", openEdit);
      loginCancelBtn.addEventListener("click", showHome);
      logoutBtn.addEventListener("click", function () {
        setLoggedIn(false);
        renderAuth();
        showHome();
      });
      editCancelBtn.addEventListener("click", showHome);
      loginId.addEventListener("focus", unlockField);
      loginPw.addEventListener("focus", unlockField);
      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (loginId.value.trim() === MASTER_ACCOUNT.id && loginPw.value === MASTER_ACCOUNT.password) {
          setLoggedIn(true);
          renderAuth();
          openEdit();
          return;
        }
        loginMsg.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
      });
      editForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const text = editVerse.value.trim();
        const ref = editRef.value.trim();
        if (!text || !ref) {
          editMsg.textContent = "말씀과 출처를 모두 입력해 주세요.";
          return;
        }
        const saveBtn = editForm.querySelector('button[type="submit"]');
        saveBtn.disabled = true;
        editMsg.textContent = "저장 중...";
        const synced = await saveVerse({ text: text, ref: ref });
        saveBtn.disabled = false;
        editMsg.textContent = synced
          ? "저장되었습니다. 다른 휴대폰에도 동일하게 적용됩니다."
          : "이 휴대폰에는 저장됐지만, 다른 기기로 보내는 데 실패했습니다. 네트워크를 확인해 주세요.";
      });
    </script>
  </body>
</html>
